[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-remediate"
version = "0.1.0"
description = "ORACLE-REMEDIATE: context-aware, safety-verified LLM remediation for CIS Benchmark compliance on Oracle Multitenant databases"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
  { name = "Devendra Rajput" },
  { name = "Venkata Seetarama Raju Dantuluri" },
  { name = "Sanjay Bajaj" },
  { name = "Anil Kolhe" },
]
keywords = ["oracle", "cis-benchmark", "database-security", "llm", "rag", "remediation", "multitenant", "exadata", "rac"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Security",
]
dependencies = [
  "PyYAML>=6.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
# Live Oracle connectivity (python-oracledb thin mode; VECTOR binds need >= 2.2)
oracle = ["oracledb>=2.2"]
# LLM backends
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
langchain = ["langchain>=0.3,<0.4", "langchain-core>=0.3,<1.8"]
# Embeddings for the RAG documentation context
embeddings = ["sentence-transformers>=3.0"]
# Snapshot diffing alternative and plotting
extras = ["deepdiff>=7.0", "matplotlib>=3.8"]
all = [
  "oracledb>=2.2", "anthropic>=0.40", "openai>=1.40",
  "langchain>=0.3,<0.4", "langchain-core>=0.3,<1.8",
  "sentence-transformers>=3.0", "deepdiff>=7.0", "matplotlib>=3.8",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
orarem = "oracle_remediate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oracle_remediate = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "oracle: integration tests that need a live Oracle database (ORAREM_TEST_DSN)",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905", "B027"]
